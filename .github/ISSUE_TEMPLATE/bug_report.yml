name: Bug report
description: Something is broken or behaves differently from what is documented.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behaviour, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it
      options:
        - API 28 emulator
        - Another emulator or device
        - CD12Max (physical)
        - Build only, no device
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Commands you ran and their actual output. "It does not work" is not reproducible.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true