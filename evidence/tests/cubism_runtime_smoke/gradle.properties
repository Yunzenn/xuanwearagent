android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The official SDK modules read these property names from the SDK's own gradle.properties
# (PROP_COMPILE_SDK_VERSION=36, PROP_MIN_SDK_VERSION=21, PROP_TARGET_SDK_VERSION=36). This build
# defines them locally so the SDK tree stays unmodified, pinned to the Android platform that is
# actually installed here (only android-35 exists; compileSdk 36 cannot be resolved offline).
PROP_COMPILE_SDK_VERSION=35
PROP_MIN_SDK_VERSION=21
PROP_TARGET_SDK_VERSION=35
